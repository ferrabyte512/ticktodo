org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App identity. Change APP_ID to your own reverse-domain ID before the first
# Play Console upload; it can never change after that.
ticktodo.applicationId=com.ferrabytes.ticktodo
ticktodo.versionCode=1
ticktodo.versionName=1.0.0

# Enabled parallel sync for Gradle 9.4+

# Public links shown in the app (Settings and sign-in). Hosted on GitHub Pages from docs/.
ticktodo.privacyPolicyUrl=https://ferrabyte512.github.io/ticktodo/legal/privacy-policy.html
ticktodo.termsUrl=
ticktodo.supportEmail=ferrabyte512@gmail.com
